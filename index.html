<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador de Películas</title>
    <!-- Aquí conectaremos los estilos más adelante -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🎬 Buscador de Películas</h1>

        <!-- Caja donde el usuario escribe y presiona el botón -->
        <div class="busqueda-box">
            <input type="text" id="inputBusqueda" placeholder="Escribe una película...">
            <button id="btnBuscar">Buscar</button>
        </div>

        <!-- Aquí es donde JavaScript pondrá los resultados -->
        <div id="contenedorPeliculas" class="grid-peliculas"></div>
    </div>

    <!-- Conectamos la lógica de JavaScript -->
    <script src="script.js"></script>
</body>
</html>
